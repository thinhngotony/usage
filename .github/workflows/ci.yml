name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m py_compile usage.py test_usage.py
      - name: Test
        run: python -m pytest -q
      - name: Check for credential-shaped strings
        run: |
          if grep -R -nE 'user_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}' --exclude-dir=.git --exclude='*.pyc' .; then
            echo 'Credential-shaped string found in tracked source.'
            exit 1
          fi
